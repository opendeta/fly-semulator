name: keepalive
# Free Hugging Face Spaces sleep after 48 h of inactivity; a light ping keeps it awake.
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping the Space
        run: |
          for url in "${{ vars.HF_SPACE_URL }}"; do
            [ -z "$url" ] && { echo "HF_SPACE_URL repo variable not set - skipping"; exit 0; }
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 "$url/login" || echo 000)
            echo "$url -> $code"
          done
